name: Feature request
description: Suggest a product or UX improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful improvement.
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Product fit
      description: How does this support "one meaningful thing per day"?
